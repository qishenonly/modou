name: CI

# 触发：push 到 main/master（含 PR 合入产生的 push）；任何 pull_request 也跑完整门禁。
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates (typecheck · lint · test · format)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本对齐根 package.json 的 packageManager: bun@1.3.14
      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Prettier check
        run: bun x prettier --check .
